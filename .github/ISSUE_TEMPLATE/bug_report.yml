name: Bug report
description: Report a reproducible account-sync, parsing, delivery, setup, installer, or UI problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste an OpenXBL API key or Discord webhook URL/token. Revoke it immediately if it was exposed.

  - type: input
    id: version
    attributes:
      label: Achievement Relay version
      placeholder: 0.2.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and display language
      placeholder: Windows 11 24H2, English (United Kingdom)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Problem area
      options:
        - Installer or Guided setup
        - OpenXBL account connection
        - Xbox achievement sync or parsing
        - Discord delivery
        - Startup or tray behaviour
        - Upgrade or uninstall
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and actual behaviour plus exact reproduction steps.
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Redacted support summary
      description: Paste Diagnostics → Copy support summary. Check again that it contains no secrets.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed OpenXBL keys, webhook URLs/tokens, XUIDs, gamertags, and other private data.
          required: true
