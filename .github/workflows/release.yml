name: Release

on:
  push:
    branches:
      - feat/signal-strip-overlay
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in vX.Y.Z format
        required: true
        default: v0.6.0
        type: string
      publish_release:
        description: Publish the immutable GitHub Release after signing checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.version || (github.ref_type == 'branch' && 'v0.6.0') || github.ref_name }}
      SIGNING_TIMESTAMP_URL: http://timestamp.digicert.com

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and run contract checks
        shell: pwsh
        run: |
          dotnet build .\AchievementRelay.sln --configuration Release
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          $previewPath = Join-Path $PWD 'artifacts\AchievementRelay_CollectorCard_Preview.png'
          $appPath = Join-Path $PWD 'src\AchievementRelay.App\bin\Release\net10.0-windows10.0.19041.0\AchievementRelay.App.exe'
          $previewArguments = "--export-collector-card-preview `"$previewPath`""
          $previewProcess = Start-Process `
            -FilePath $appPath `
            -ArgumentList $previewArguments `
            -Wait `
            -PassThru
          if ($previewProcess.ExitCode -ne 0 -or
              -not (Test-Path -LiteralPath $previewPath -PathType Leaf)) {
            throw 'The real Collector Card renderer did not produce its bounded preview PNG.'
          }
          $previewBytes = [System.IO.File]::ReadAllBytes($previewPath)
          $previewSignature = if ($previewBytes.Length -ge 8) {
            [Convert]::ToHexString([byte[]] $previewBytes[0..7])
          }
          $previewChunk = if ($previewBytes.Length -ge 24) {
            [Text.Encoding]::ASCII.GetString($previewBytes, 12, 4)
          }
          $previewWidth = if ($previewBytes.Length -ge 24) {
            [Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($previewBytes, 16))
          }
          $previewHeight = if ($previewBytes.Length -ge 24) {
            [Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($previewBytes, 20))
          }
          if ($previewBytes.Length -le 10KB -or
              $previewSignature -cne '89504E470D0A1A0A' -or
              $previewChunk -cne 'IHDR' -or
              $previewWidth -ne 1200 -or
              $previewHeight -ne 675) {
            throw 'The Collector Card preview must be the real 1200x675 PNG output.'
          }
          $signalPreviewPath = Join-Path $PWD 'artifacts\AchievementRelay_SignalStrip_Preview.png'
          $signalPreviewArguments = "--export-signal-strip-preview `"$signalPreviewPath`""
          $signalPreviewProcess = Start-Process `
            -FilePath $appPath `
            -ArgumentList $signalPreviewArguments `
            -Wait `
            -PassThru
          if ($signalPreviewProcess.ExitCode -ne 0 -or
              -not (Test-Path -LiteralPath $signalPreviewPath -PathType Leaf)) {
            throw 'The real Signal Strip renderer did not produce its bounded preview PNG.'
          }
          $signalPreviewBytes = [System.IO.File]::ReadAllBytes($signalPreviewPath)
          $signalPreviewSignature = if ($signalPreviewBytes.Length -ge 8) {
            [Convert]::ToHexString([byte[]] $signalPreviewBytes[0..7])
          }
          $signalPreviewChunk = if ($signalPreviewBytes.Length -ge 24) {
            [Text.Encoding]::ASCII.GetString($signalPreviewBytes, 12, 4)
          }
          $signalPreviewWidth = if ($signalPreviewBytes.Length -ge 24) {
            [Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($signalPreviewBytes, 16))
          }
          $signalPreviewHeight = if ($signalPreviewBytes.Length -ge 24) {
            [Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($signalPreviewBytes, 20))
          }
          if ($signalPreviewBytes.Length -le 2KB -or
              $signalPreviewSignature -cne '89504E470D0A1A0A' -or
              $signalPreviewChunk -cne 'IHDR' -or
              $signalPreviewWidth -ne 520 -or
              $signalPreviewHeight -ne 76) {
            throw 'The Signal Strip preview must be the real 520x76 PNG output.'
          }
          dotnet run --project .\tests\AchievementRelay.Core.Tests --configuration Release --no-build
          dotnet run --project .\tests\AchievementRelay.App.Tests --configuration Release --no-build
          $bridgeOutput = & .\src\AchievementRelay.SteamBridge\bin\Release\net48\AchievementRelay.SteamBridge.exe --self-test
          if ($LASTEXITCODE -ne 0 -or $bridgeOutput -notmatch '"protocolVersion":1' -or $bridgeOutput -notmatch '"status":"self-test"' -or $bridgeOutput -notmatch '"message":"ok"') {
            throw "Steam bridge self-test failed: $bridgeOutput"
          }
          .\scripts\Test-Repository.ps1

      - name: Build signed packages
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must use vX.Y.Z format; received '$env:RELEASE_TAG'."
          }

          $threePartVersion = $env:RELEASE_TAG.Substring(1)
          $msixVersion = "$threePartVersion.0"
          $arguments = @{
            Version = $msixVersion
          }

          if (-not $env:SIGNING_PFX_BASE64 -or
              -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Official self-updating releases require the persistent project signing PFX and its password.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'AchievementRelay.Signing.pfx'
          $publisherCertificatePath = Join-Path $env:GITHUB_WORKSPACE 'release\AchievementRelay.Publisher.cer'
          $trustedCertificate = $null
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $trustedCertificate = Import-Certificate `
              -FilePath $publisherCertificatePath `
              -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'

            $arguments.PfxPath = $pfxPath
            $arguments.PfxPassword = $env:SIGNING_PFX_PASSWORD
            $arguments.TimestampUrl = $env:SIGNING_TIMESTAMP_URL
            $arguments.AllowUntrustedProjectCertificate = $true
            .\scripts\Build-Release.ps1 @arguments

            $publisherFingerprint = (Get-FileHash -LiteralPath $publisherCertificatePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $signedFiles = @(
              '.\artifacts\AchievementRelay_Setup.exe',
              ".\artifacts\AchievementRelay_${msixVersion}_x64.msix",
              ".\artifacts\AchievementRelay_${msixVersion}_arm64.msix"
            )
            foreach ($signedFile in $signedFiles) {
              $authenticode = Get-AuthenticodeSignature -LiteralPath $signedFile
              if ($authenticode.Status -ne 'Valid' -or -not $authenticode.SignerCertificate) {
                throw "Windows did not validate the Authenticode signature on $signedFile."
              }
              $signerFingerprint = -join @(
                [System.Security.Cryptography.SHA256]::HashData($authenticode.SignerCertificate.RawData) |
                  ForEach-Object { $_.ToString('x2') }
              )
              if ($signerFingerprint -cne $publisherFingerprint) {
                throw "$signedFile was not signed by the reviewed Achievement Relay publisher certificate."
              }
            }

            $expectedAssets = @(
              'AchievementRelay_Setup.exe',
              'AchievementRelay_Update.json',
              'AchievementRelay_Update.sig',
              'AchievementRelay.Publisher.cer',
              "AchievementRelay_${msixVersion}_x64.msix",
              "AchievementRelay_${msixVersion}_arm64.msix",
              "AchievementRelay_${msixVersion}_installer.zip"
            )
            foreach ($assetName in $expectedAssets) {
              if (-not (Test-Path -LiteralPath (Join-Path '.\artifacts' $assetName) -PathType Leaf)) {
                throw "The official release asset set is incomplete: $assetName is missing."
              }
            }
          }
          finally {
            if ($trustedCertificate) {
              Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($trustedCertificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Retain signed release candidate
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish_release) || github.ref == 'refs/heads/feat/signal-strip-overlay' }}
        uses: actions/upload-artifact@v4
        with:
          name: AchievementRelay-${{ env.RELEASE_TAG }}-signed-candidate
          path: |
            artifacts/AchievementRelay_Setup.exe
            artifacts/AchievementRelay_*.msix
            artifacts/AchievementRelay_*_installer.zip
            artifacts/AchievementRelay.Publisher.cer
            artifacts/AchievementRelay_Update.json
            artifacts/AchievementRelay_Update.sig
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish GitHub release
        if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem .\artifacts -File |
            Where-Object { $_.Extension -in '.exe', '.msix', '.zip', '.cer', '.json', '.sig' } |
            ForEach-Object FullName
          $version = $env:RELEASE_TAG.Substring(1)
          $releaseNotesPath = ".\docs\RELEASE-NOTES-$version.md"
          $releaseArguments = @(
            'release', 'create', $env:RELEASE_TAG
          ) + $files + @(
            '--title', "Achievement Relay $env:RELEASE_TAG",
            '--target', '${{ github.sha }}'
          )
          if (Test-Path -LiteralPath $releaseNotesPath) {
            $releaseArguments += @('--notes-file', $releaseNotesPath)
          }
          else {
            $releaseArguments += '--generate-notes'
          }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed.'
          }
