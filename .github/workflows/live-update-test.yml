name: Controlled live updater test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/steam-integration
    paths:
      - .github/workflows/live-update-test.yml

permissions:
  contents: write

concurrency:
  group: achievement-relay-live-update-test
  cancel-in-progress: true

jobs:
  package-publish-and-verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-update-test]')
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      RELEASE_TAG: v0.3.1
      BASELINE_REF: ed80821ed8ec351fb5a010c7324eaa1a31cd2f5d
      BASELINE_VERSION: 0.3.0
      BASELINE_PACKAGE_VERSION: 0.3.0.0
      TARGET_VERSION: 0.3.1
      TARGET_PACKAGE_VERSION: 0.3.1.0

    steps:
      - name: Check out redesigned target
        uses: actions/checkout@v6
        with:
          path: target

      - name: Check out pre-redesign baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate target source and contracts
        shell: pwsh
        working-directory: target
        run: |
          dotnet build .\AchievementRelay.sln --configuration Release
          dotnet run --project .\tests\AchievementRelay.Core.Tests --configuration Release --no-build
          $bridgeOutput = & .\src\AchievementRelay.SteamBridge\bin\Release\net48\AchievementRelay.SteamBridge.exe --self-test
          if ($LASTEXITCODE -ne 0 -or
              $bridgeOutput -notmatch '"protocolVersion":1' -or
              $bridgeOutput -notmatch '"status":"self-test"' -or
              $bridgeOutput -notmatch '"message":"ok"') {
            throw "Steam bridge self-test failed: $bridgeOutput"
          }
          .\scripts\Test-Repository.ps1

      - name: Create one ephemeral signing identity
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"

          $signingDirectory = Join-Path $env:RUNNER_TEMP 'achievement-relay-live-update-signing'
          New-Item -ItemType Directory -Path $signingDirectory -Force | Out-Null
          $pfxPath = Join-Path $signingDirectory 'AchievementRelay.LiveUpdateTest.pfx'
          $cerPath = Join-Path $signingDirectory 'AchievementRelay.Development.cer'

          & .\target\scripts\New-DevelopmentCertificate.ps1 `
            -PfxPath $pfxPath `
            -CerPath $cerPath `
            -Password $password

          Import-Certificate `
            -FilePath $cerPath `
            -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $certificateSha256 = (Get-FileHash -LiteralPath $cerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "TEST_SIGNING_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_SIGNING_CER=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_SIGNING_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_CERTIFICATE_SHA256=$certificateSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build matched baseline and target installers
        shell: pwsh
        run: |
          function Build-ControlledPackage {
            param(
              [Parameter(Mandatory)] [string] $RepositoryRoot,
              [Parameter(Mandatory)] [string] $ApplicationVersion,
              [Parameter(Mandatory)] [string] $PackageVersion,
              [string] $UpdatePolicyPath
            )

            $artifacts = Join-Path $RepositoryRoot 'artifacts'
            $releaseArguments = @{
              Version = $PackageVersion
              ApplicationVersion = $ApplicationVersion
              PfxPath = $env:TEST_SIGNING_PFX
              PfxPassword = $env:TEST_SIGNING_PASSWORD
              AllowUntrustedDevelopmentCertificate = $true
            }
            if ($UpdatePolicyPath) {
              $releaseArguments.UpdatePolicyPath = $UpdatePolicyPath
            }
            & (Join-Path $RepositoryRoot 'scripts\Build-Release.ps1') @releaseArguments

            Copy-Item `
              -LiteralPath $env:TEST_SIGNING_CER `
              -Destination (Join-Path $artifacts 'AchievementRelay.Development.cer') `
              -Force

            # Rebuild Setup after adding the public certificate so a clean test PC
            # receives the normal one-time Windows trust prompt from Install.ps1.
            & (Join-Path $RepositoryRoot 'scripts\Build-Installer.ps1') `
              -Version $ApplicationVersion `
              -MsixVersion $PackageVersion `
              -PackageDirectory $artifacts `
              -OutputDirectory $artifacts `
              -PfxPath $env:TEST_SIGNING_PFX `
              -PfxPassword $env:TEST_SIGNING_PASSWORD

            $manifestArguments = @{
              Version = $ApplicationVersion
              PackageVersion = $PackageVersion
              InstallerPath = Join-Path $artifacts 'AchievementRelay_Setup.exe'
              OutputPath = Join-Path $artifacts 'AchievementRelay_Update.json'
              OutputSignaturePath = Join-Path $artifacts 'AchievementRelay_Update.sig'
              PfxPath = $env:TEST_SIGNING_PFX
              PfxPassword = $env:TEST_SIGNING_PASSWORD
            }
            if ($UpdatePolicyPath) {
              $manifestArguments.PolicyPath = $UpdatePolicyPath
            }
            & (Join-Path $RepositoryRoot 'scripts\New-UpdateManifest.ps1') @manifestArguments
          }

          $baselineRoot = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $targetRoot = Join-Path $env:GITHUB_WORKSPACE 'target'
          # The pinned baseline supplies the old app/UI. Use the current reviewed
          # release orchestrator so both halves receive the same test-only trust gate.
          Copy-Item `
            -LiteralPath (Join-Path $targetRoot 'scripts\Build-Release.ps1') `
            -Destination (Join-Path $baselineRoot 'scripts\Build-Release.ps1') `
            -Force
          Build-ControlledPackage `
            -RepositoryRoot $baselineRoot `
            -ApplicationVersion $env:BASELINE_VERSION `
            -PackageVersion $env:BASELINE_PACKAGE_VERSION
          Build-ControlledPackage `
            -RepositoryRoot $targetRoot `
            -ApplicationVersion $env:TARGET_VERSION `
            -PackageVersion $env:TARGET_PACKAGE_VERSION `
            -UpdatePolicyPath (Join-Path $targetRoot 'release\live-update-test-policy.json')

          Copy-Item `
            -LiteralPath (Join-Path $baselineRoot 'artifacts\AchievementRelay_Setup.exe') `
            -Destination (Join-Path $targetRoot 'artifacts\AchievementRelay_Baseline_Setup.exe') `
            -Force

      - name: Verify the complete update trust chain
        shell: pwsh
        run: |
          $targetArtifacts = Join-Path $env:GITHUB_WORKSPACE 'target\artifacts'
          $baselineSetup = Join-Path $targetArtifacts 'AchievementRelay_Baseline_Setup.exe'
          $targetSetup = Join-Path $targetArtifacts 'AchievementRelay_Setup.exe'
          $manifestPath = Join-Path $targetArtifacts 'AchievementRelay_Update.json'
          $signaturePath = Join-Path $targetArtifacts 'AchievementRelay_Update.sig'
          $certificatePath = Join-Path $targetArtifacts 'AchievementRelay.Development.cer'

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $signature = Get-Content -LiteralPath $signaturePath -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:TARGET_VERSION -or
              $manifest.packageVersion -cne $env:TARGET_PACKAGE_VERSION -or
              $manifest.minimumSupportedVersion -cne $env:TARGET_VERSION) {
            throw 'The controlled target does not describe the expected required update.'
          }

          $targetFile = Get-Item -LiteralPath $targetSetup
          $targetSha256 = (Get-FileHash -LiteralPath $targetSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.installer.assetName -cne 'AchievementRelay_Setup.exe' -or
              $manifest.installer.sha256 -cne $targetSha256 -or
              [Int64] $manifest.installer.size -ne $targetFile.Length) {
            throw 'The target installer does not match its signed update manifest.'
          }

          $certificateSha256 = (Get-FileHash -LiteralPath $certificatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($signature.certificateSha256 -cne $certificateSha256 -or
              $certificateSha256 -cne $env:TEST_CERTIFICATE_SHA256) {
            throw 'The release certificate does not match the manifest signature envelope.'
          }

          foreach ($installerPath in $baselineSetup, $targetSetup) {
            $authenticode = Get-AuthenticodeSignature -LiteralPath $installerPath
            if (-not $authenticode.SignerCertificate -or
                ([string] $authenticode.Status) -in @('HashMismatch', 'NotSigned')) {
              throw "The installer does not contain an intact Authenticode signature: $installerPath"
            }

            $signerSha256 = [System.Security.Cryptography.SHA256]::HashData(
              $authenticode.SignerCertificate.RawData)
            $signerFingerprint = -join @($signerSha256 | ForEach-Object { $_.ToString('x2') })
            if ($signerFingerprint -cne $certificateSha256) {
              throw "The installer signer does not match the controlled certificate: $installerPath"
            }
          }

          $baselineSha256 = (Get-FileHash -LiteralPath $baselineSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesPath = Join-Path $targetArtifacts 'LIVE_UPDATE_TEST.md'
          @"
          ## Controlled required-update test

          This stable tag exists temporarily so Achievement Relay's production GitHub discovery path can see it.

          1. Download and run AchievementRelay_Baseline_Setup.exe (v$($env:BASELINE_VERSION), pre-redesign UI).
          2. Windows may request administrator approval once to trust the temporary test certificate.
          3. When the app opens, confirm that v$($env:TARGET_VERSION) is shown as a **required** update and monitoring is paused.
          4. Select **Update now** and confirm the musical updater opens with 10% volume, Pause/Play, and the CRNY SoundCloud link.
          5. Complete the updater and confirm the redesigned Home and four-step Setup experience opens with settings and state preserved.

          Baseline setup SHA-256: $baselineSha256

          Target setup SHA-256: $targetSha256

          Test certificate SHA-256: $certificateSha256

          Do not redistribute these development-certificate builds as a production release.
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

      - name: Retain the matched installer pair
        uses: actions/upload-artifact@v4
        with:
          name: AchievementRelay-v0.3.1-required-update-test
          path: |
            target/artifacts/AchievementRelay_Baseline_Setup.exe
            target/artifacts/AchievementRelay_Setup.exe
            target/artifacts/AchievementRelay.Development.cer
            target/artifacts/AchievementRelay_Update.json
            target/artifacts/AchievementRelay_Update.sig
            target/artifacts/LIVE_UPDATE_TEST.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish controlled stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $($env:RELEASE_TAG) already exists; controlled releases are never overwritten."
          }

          $targetArtifacts = Join-Path $env:GITHUB_WORKSPACE 'target\artifacts'
          $releaseFiles = @(
            (Join-Path $targetArtifacts 'AchievementRelay_Baseline_Setup.exe'),
            (Join-Path $targetArtifacts 'AchievementRelay_Setup.exe'),
            (Join-Path $targetArtifacts 'AchievementRelay.Development.cer'),
            (Join-Path $targetArtifacts 'AchievementRelay_Update.json'),
            (Join-Path $targetArtifacts 'AchievementRelay_Update.sig')
          )

          gh release create $env:RELEASE_TAG $releaseFiles `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Achievement Relay $($env:RELEASE_TAG) — controlled updater test" `
            --notes-file (Join-Path $targetArtifacts 'LIVE_UPDATE_TEST.md') `
            --draft
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub did not create the controlled updater release draft.'
          }

          $draft = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets,isDraft,isPrerelease,tagName | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.isPrerelease -or $draft.tagName -cne $env:RELEASE_TAG -or
              @($draft.assets).Count -ne $releaseFiles.Count) {
            throw 'The complete controlled release was not retained safely as a draft.'
          }

          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'The verified controlled updater release remained safely in draft state.'
          }

      - name: Verify live GitHub update discovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = $null
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $response = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest"
            if ($LASTEXITCODE -eq 0) {
              $candidate = $response | ConvertFrom-Json
              if ($candidate.tag_name -ceq $env:RELEASE_TAG -and
                  -not $candidate.draft -and
                  -not $candidate.prerelease) {
                $latest = $candidate
                break
              }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $latest) {
            throw 'The GitHub latest-stable endpoint did not expose the controlled release.'
          }

          $expectedAssets = @(
            'AchievementRelay_Baseline_Setup.exe',
            'AchievementRelay_Setup.exe',
            'AchievementRelay.Development.cer',
            'AchievementRelay_Update.json',
            'AchievementRelay_Update.sig'
          )
          foreach ($assetName in $expectedAssets) {
            if (@($latest.assets | Where-Object name -CEQ $assetName).Count -ne 1) {
              throw "The latest release does not expose exactly one $assetName asset."
            }
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'target\artifacts\AchievementRelay_Update.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $installerAsset = $latest.assets | Where-Object name -CEQ 'AchievementRelay_Setup.exe'
          if ([Int64] $installerAsset.size -ne [Int64] $manifest.installer.size) {
            throw 'The live GitHub installer metadata does not match the signed manifest.'
          }

          Write-Host "Verified live required-update discovery at $($latest.html_url)" -ForegroundColor Green
