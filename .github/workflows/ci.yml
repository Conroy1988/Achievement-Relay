name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AchievementRelay.sln

      - name: Build
        run: dotnet build .\AchievementRelay.sln --configuration Release --no-restore

      - name: Run core contract checks
        run: dotnet run --project .\tests\AchievementRelay.Core.Tests --configuration Release --no-build

      - name: Validate repository and MSIX manifest
        shell: pwsh
        run: .\scripts\Test-Repository.ps1

      - name: Create unsigned installer smoke artifacts
        shell: pwsh
        run: |
          .\scripts\Build-Msix.ps1 -Architecture x64 -Version 0.1.1.0 -OutputDirectory .\artifacts\ci
          .\scripts\Build-Msix.ps1 -Architecture arm64 -Version 0.1.1.0 -OutputDirectory .\artifacts\ci
          .\scripts\Build-Installer.ps1 -Version 0.1.1 -MsixVersion 0.1.1.0 -PackageDirectory .\artifacts\ci -OutputDirectory .\artifacts\ci
