name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AchievementRelay.sln

      - name: Build
        run: dotnet build .\AchievementRelay.sln --configuration Release --no-restore

      - name: Run core contract checks
        run: dotnet run --project .\tests\AchievementRelay.Core.Tests --configuration Release --no-build

      - name: Validate repository and MSIX manifest
        shell: pwsh
        run: .\scripts\Test-Repository.ps1

      - name: Create signed Windows test installer
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version 0.2.1.0

      - name: Retain pull-request installer for Windows verification
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AchievementRelay-v0.2.1-windows-test
          path: |
            artifacts/AchievementRelay_Setup.exe
            artifacts/AchievementRelay_0.2.1.0_x64.msix
            artifacts/AchievementRelay_0.2.1.0_arm64.msix
            artifacts/AchievementRelay_0.2.1.0_installer.zip
            artifacts/AchievementRelay.Development.cer
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
